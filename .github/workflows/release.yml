name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      minecraft: ${{ steps.meta.outputs.minecraft }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and Minecraft target
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          minecraft=$(sed -n 's/^minecraft *= *"\(.*\)"$/\1/p' gradle/libs.versions.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build -PbuildVersion=${{ steps.meta.outputs.version }} --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LetsTroll-paper
          path: paper/build/libs/LetsTroll-paper-*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: LetsTroll-fabric
          path: fabric/build/libs/LetsTroll-fabric-*.jar
          if-no-files-found: error

  modrinth:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A new loader is one entry here plus its Gradle module and an upload step above.
        include:
          - artifact: LetsTroll-paper
            loaders: |
              paper
              purpur
              folia
          - artifact: LetsTroll-fabric
            loaders: |
              fabric
              quilt
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID || 'lets-troll' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/*.jar
          name: LetsTroll ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: release
          loaders: ${{ matrix.loaders }}
          game-versions: ${{ needs.build.outputs.minecraft }}
          java: 21
          # Unfeaturing older versions needs a token that may edit versions;
          # the release token is only allowed to create them.
          modrinth-unfeature-mode: none

  github-release:
    needs: [build, modrinth]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LetsTroll-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LetsTroll ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: dist/*.jar
